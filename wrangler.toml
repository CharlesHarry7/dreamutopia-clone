# DreamUtopia clone — Next.js on Cloudflare Workers (OpenNext)
# Deploy: npm run cf:deploy   Preview: npm run cf:preview   Docs: DEPLOY.md
# Reuses D1 / KV / R2 from the previous Pages project (same resource IDs).
name = "dreamutopia-clone"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dreamutopia-db"
database_id = "148c47fa-55da-4423-b031-1a74e4216014"

[[kv_namespaces]]
binding = "SESSIONS"
id = "6b2dbe20ae95452f8f22b98f0ce6196e"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dreamutopia-media"

# Secrets (wrangler secret put / Workers dashboard):
#   KIE_API_KEY
#   KIE_WEBHOOK_HMAC_KEY                   (optional)
#   STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET  (paid credits)
#   RESEND_API_KEY + MAIL_FROM                 (password reset + welcome email)
