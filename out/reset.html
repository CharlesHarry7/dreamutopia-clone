<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — DreamUtopia</title>
<meta name="description" content="Choose a new password for your DreamUtopia account.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d12;--bg2:#16161e;--text:#fff;--text2:#a8a8b8;--text3:#6a6a7a;--primary:#a855f7;--accent:#ec4899;--red:#ef4444}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
header{background:rgba(13,13,18,.92);border-bottom:1px solid #2a2a38;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo img{width:28px;height:28px;border-radius:7px}
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.auth-card{width:100%;max-width:420px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:32px 28px}
h1{font-size:24px;font-weight:800;margin-bottom:8px}
.lead{font-size:14px;color:var(--text2);margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.field input{width:100%;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;font-family:inherit}
.submit{width:100%;margin-top:8px;padding:14px;border-radius:12px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.submit:disabled{opacity:.55;cursor:not-allowed}
.form-error{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fecaca;font-size:13px}
.form-error.show{display:block}
.back{display:block;margin-top:16px;text-align:center;font-size:13px;color:var(--text3)}
footer{padding:28px 20px;text-align:center;font-size:13px;color:var(--text3)}
</style>
<link rel="stylesheet" href="/assets/css/chrome.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
<header>
<a href="/" class="logo"><img src="/assets/images/logo.webp" alt="" width="28" height="28"> DreamUtopia AI</a>
<div style="display:flex;align-items:center;gap:12px">
<a href="/auth?mode=login" style="color:#a8a8b8;font-size:14px" data-i18n="hdr.login">Log In</a>
<select class="lang-select" aria-label="Language" style="appearance:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;padding:7px 28px 7px 12px;border-radius:999px;font-size:12.5px;font-family:inherit">
<option value="en">English</option>
<option value="zh">中文</option>
<option value="ja">日本語</option>
<option value="es">Español</option>
</select>
</div>
</header>
<main id="main" class="auth-main">
<div class="auth-card">
<h1 data-i18n="auth.reset.h">Reset password</h1>
<p class="lead" id="lead" data-i18n="auth.reset.lead">Enter a new password. This link expires in one hour.</p>
<form id="resetForm">
<div class="field">
<label for="password" data-i18n="auth.reset.new">New password</label>
<input id="password" type="password" autocomplete="new-password" required minlength="6" data-i18n-placeholder="auth.passPh" placeholder="At least 6 characters">
</div>
<button class="submit" id="submitBtn" type="submit" data-i18n="auth.reset.submit">Save password</button>
<div class="form-error" id="formError" role="alert"></div>
</form>
<a class="back" href="/auth?mode=login" data-i18n="auth.back">← Back to log in</a>
</div>
</main>
<footer>© DreamUtopia AI · <a href="/privacy" style="color:#c084fc" data-i18n="foot.privacy">Privacy</a></footer>
<script src="/assets/js/du.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/seo.js"></script>
<script>
const TOKEN_KEY = "dreamutopia_token";
const params = new URLSearchParams(location.search);
const token = (params.get("token") || "").trim();
const formError = document.getElementById("formError");
const submitBtn = document.getElementById("submitBtn");
const passwordInput = document.getElementById("password");
if (window.DU && DU.bindPasswordToggle) DU.bindPasswordToggle(passwordInput);
if (!/^[a-f0-9]{32}$/.test(token)) {
  document.getElementById("lead").textContent = (window.DU && DU.t)
    ? DU.t("auth.reset.invalid", "This reset link is missing or invalid. Request a new one from the login page.")
    : "This reset link is missing or invalid. Request a new one from the login page.";
  document.getElementById("resetForm").hidden = true;
}
document.getElementById("resetForm").onsubmit = async function (e) {
  e.preventDefault();
  formError.classList.remove("show");
  const password = passwordInput.value;
  if (password.length < 6) {
    formError.textContent = (window.DU && DU.t) ? DU.t("auth.pass.short", "Password must be at least 6 characters.") : "Password must be at least 6 characters.";
    formError.classList.add("show");
    passwordInput.setAttribute("aria-invalid", "true");
    passwordInput.focus();
    return;
  }
  passwordInput.removeAttribute("aria-invalid");
  submitBtn.disabled = true;
  try {
    const res = await fetch("/api/auth/reset", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ token: token, password: password }),
    });
    const data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || "Reset failed");
    if (data.token) localStorage.setItem(TOKEN_KEY, data.token);
    location.href = "/workspace";
  } catch (err) {
    formError.textContent = err.message || "Reset failed";
    formError.classList.add("show");
    submitBtn.disabled = false;
  }
};
</script>
</body>
</html>
